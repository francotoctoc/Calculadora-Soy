name: Actualizar cotizacion BCU

on:
  schedule:
    - cron: "0 11,15,20,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar BCU
        run: python scripts/actualizar_cotizacion.py
      - name: Guardar cambios
        run: |
          if git diff --quiet cotizacion.json; then
            echo "Sin cambios"
          else
            git config user.name "actualizador-cotizacion"
            git config user.email "actions@users.noreply.github.com"
            git add cotizacion.json
            git commit -m "Cotizacion BCU $(date -u +%F)"
            git push
          fi
